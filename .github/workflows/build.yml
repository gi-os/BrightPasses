name: Build & Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Read version name
        id: ver
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "MovieTickets-v${VN}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieTickets-apk
          path: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      # Only main publishes. A branch push builds and runs the tests and stops there: this
      # workflow tags v${versionName} and marks it latest, so a branch reaching this step would
      # hand the phone an unreviewed APK through Obtainium.
      - name: Publish / update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Movie Tickets v${{ steps.ver.outputs.version }}
          files: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true
