name: Build & Release APK

on:
  push:
    # Was a bare `push:`, which released from every branch — so a feature branch or a
    # check run published straight to the phone. Releases come from main only.
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/check.yml'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      - name: Read version name
        id: ver
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VN" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "MovieTickets-v${VN}.apk"

      # Android identifies an app by (packageName, signing certificate). If the cert ever
      # drifts, Obtainium updates fail with an opaque "Failure: Invalid" and the only way
      # back is uninstall-and-lose-your-stubs. This shipped broken in LightFastread for 11
      # builds before anyone noticed, so pin it and fail the build instead.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs MovieTickets-v*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' :' | tr 'A-F' 'a-f')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieTickets-apk
          path: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      # Only main publishes. A branch push builds and runs the tests and stops there: this
      # workflow tags v${versionName} and marks it latest, so a branch reaching this step would
      # hand the phone an unreviewed APK through Obtainium.
      - name: Publish / update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Movie Tickets v${{ steps.ver.outputs.version }}
          files: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
