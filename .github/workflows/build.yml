name: Build & Release APK

on:
  push:
    # Was a bare `push:`, which released from every branch — so a feature branch or a
    # check run published straight to the phone. Releases come from main only.
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/check.yml'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Restore release signing key and lineage
        id: signing
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for secret in RELEASE_KEYSTORE_BASE64 SIGNING_LINEAGE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ ! ${!secret} =~ [^[:space:]] ]]; then
              echo "::error::Missing required release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/brightpasses-signing.XXXXXX")
          decode() {
            if ! printf '%s' "${!1}" | base64 --decode > "$2" || [[ ! -s "$2" ]]; then
              echo "::error::$1 must contain non-empty base64"
              exit 1
            fi
          }
          decode RELEASE_KEYSTORE_BASE64 "$signing_dir/release.jks"
          decode SIGNING_LINEAGE_BASE64 "$signing_dir/release.lineage"
          printf 'keystore=%s\nlineage=%s\n' "$signing_dir/release.jks" "$signing_dir/release.lineage" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build unsigned shipping release APK
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      - name: Read version name
        id: ver
        run: |
          VN=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VN" >> "$GITHUB_OUTPUT"

      - name: Sign and verify shipping release APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore }}
          SIGNING_LINEAGE_FILE: ${{ steps.signing.outputs.lineage }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bash scripts/sign-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "MovieTickets-v$VERSION.apk" signing-lineage-root-fingerprint.txt signing-fingerprint.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieTickets-apk
          path: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      # Only main publishes. A branch push builds and runs the tests and stops there: this
      # workflow tags v${versionName} and marks it latest, so a branch reaching this step would
      # hand the phone an unreviewed APK through Obtainium.
      - name: Publish / update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Movie Tickets v${{ steps.ver.outputs.version }}
          files: MovieTickets-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
