<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LightPass · Key QR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#000; color:#eee; font:16px/1.5 -apple-system,system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:28px 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:#888; margin:0 0 24px; text-align:center; }
  .card { width:100%; max-width:420px; background:#0d0d0d; border:1px solid #222; border-radius:14px;
          padding:18px; margin-bottom:18px; }
  label { display:block; font-size:13px; color:#9a9a9a; margin-bottom:6px; }
  input { width:100%; padding:12px; border-radius:9px; border:1px solid #333; background:#111; color:#fff;
          font-size:15px; }
  button { width:100%; margin-top:12px; padding:12px; border:0; border-radius:9px; background:#fff; color:#000;
           font-size:16px; font-weight:600; }
  .qr { display:none; margin-top:16px; padding:16px; background:#fff; border-radius:12px; }
  .qr.show { display:flex; justify-content:center; }
  .err { color:#ff6b6b; font-size:14px; margin-top:10px; }
  footer { color:#666; font-size:13px; margin-top:8px; text-align:center; }
</style>
</head>
<body>
  <h1>LightPass</h1>
  <p class="sub">Generate a QR, then scan it in the app. Keys never leave your browser.</p>

  <div class="card">
    <label>Anthropic API key</label>
    <input id="anthropic" placeholder="sk-ant-..." autocomplete="off" />
    <button onclick="gen('anthropic')">Generate QR</button>
    <div id="anthropic_qr" class="qr"></div>
  </div>

  <div class="card">
    <label>TMDb API key (v3)</label>
    <input id="tmdb" placeholder="TMDb v3 api key" autocomplete="off" />
    <button onclick="gen('tmdb')">Generate QR</button>
    <div id="tmdb_qr" class="qr"></div>
  </div>

  <footer>In the app: Settings → Scan QR (next to each key).</footer>

  <script src="https://cdn.jsdelivr.net/npm/davidshimjs-qrcodejs@0.0.2/qrcode.min.js"></script>
  <script>
    function gen(kind) {
      const box = document.getElementById(kind + '_qr');
      box.innerHTML = '';
      if (typeof QRCode === 'undefined') {
        box.innerHTML = '<p class="err">QR library failed to load — check your connection.</p>';
        box.classList.add('show'); return;
      }
      const val = document.getElementById(kind).value.trim();
      if (!val) { box.classList.remove('show'); return; }
      // prefix so the app routes it to the right key
      new QRCode(box, { text: kind + ':' + val, width: 240, height: 240,
        colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.M });
      box.classList.add('show');
    }
  </script>
</body>
</html>
